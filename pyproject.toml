[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orient"
version = "0.1.0"
description = "Generate an orientation report for a codebase you did not write"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "orient contributors" }]
keywords = ["codebase", "onboarding", "orientation", "git", "static-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
orient = "orient.cli:main"

[project.urls]
Homepage = "https://github.com/orient-tool/orient"

[tool.hatch.build.targets.wheel]
packages = ["src/orient"]

[tool.hatch.build.targets.sdist]
include = ["src/orient", "tests", "schema", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
